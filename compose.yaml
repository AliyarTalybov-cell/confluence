services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: confluence
      POSTGRES_USER: confluence
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
  confluence:
    image: haxqer/confluence:8.5.19
    depends_on:
      - postgres
    environment:
      JVM_MINIMUM_MEMORY: 1g
      JVM_MAXIMUM_MEMORY: 2g
      JVM_CODE_CACHE_ARGS: '-XX:InitialCodeCacheSize=128m -XX:ReservedCodeCacheSize=512m'
    ports:
      - '127.0.0.1:8090:8090'
    volumes:
      - confluence_data:/var/confluence
    restart: unless-stopped
volumes:
  postgres_data:
  confluence_data:
